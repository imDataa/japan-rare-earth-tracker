<style>
  :root {
    --bg-base: #080C17;
    --bg-card: #0E1525;
    --border: #1A2640;
    --gold: #D4A843;
    --green: #3DD67A;
    --red: #E05252;
    --teal: #22C8A8;
    --text-primary: #E2EAF8;
    --text-secondary: #6B7FA0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
    }
    header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 20px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  }
  h1 {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  }
  h1 span { color: var(--gold); }
  .header-tag {
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.2em;
  margin-bottom: 6px;
  }
  .header-date {
  font-size: 11px;
  color: var(--text-secondary);
  text-align: right;
  line-height: 1.8;
  }
  .header-date strong {
  color: var(--text-primary);
  }
  .section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.carte {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
}
  .grille-news {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.actu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
}
.actu-card-header {

}

  padding: 2px 8px;
  border-radius: 4px;
}

  font-size: 12px;

  border-bottom: 1px solid var(--border);
}

  display: grid;

  }

  border: 1px solid rgba(224, 82, 82, 0.4);

  color: var(--text-muted, #3A4A66);

  }
  .corr-val {
  font-size: 10px;
  color: var(--text-secondary);
  min-width: 28px;
  text-align: right;
  }
  .corr-bar-bg {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  }
  .corr-bar-fill { height: 100%; border-radius: 2px; }

  border-color: var(--gold);
  margin-bottom: 20px;

  .carte-etf .carte-prix {
  font-size: 32px;
  }
  .carte-etf .carte-nom {
  font-size: 15px;
  }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .etf-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.etf-stats {
  display: flex;
  gap: 28px;
}
.etf-stat {
  text-align: center;
}
.etf-stat-label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-muted, #3A4A66);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.etf-stat-value {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}

  footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-secondary);
}
footer strong { color: var(--gold); font-weight: 400; }
.footer-dot { color: var(--teal); }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:

    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.3;
  pointer-events: none;
  z-index: -1;
}

const actuContainer = document.getElementById("actualites");
DATA.forEach(t => {
  if (t.news && t.news.length > 0) {
    const card = document.createElement("div");
    card.className = "actu-card";
    const items = t.news.map(n => `
      <div class="actu-item">
        <a href="${n.lien}" target="_blank">${n.titre}</a>
      </div>
    `).join("");
    card.innerHTML = `
      <div class="actu-card-header">
        <span class="actu-ticker-pill">${t.ticker}</span>
        <span style="font-size:12px; color: var(--text-secondary);">${t.nom}</span>
      </div>
      ${items}
    `;
    actuContainer.appendChild(card);
  }
});
