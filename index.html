<style>
  :root {
    --bg-base: #080C17;
    --bg-card: #0E1525;
    --border: #1A2640;
    --gold: #D4A843;
    --green: #3DD67A;
    --red: #E05252;
    --teal: #22C8A8;
    --text-primary: #E2EAF8;
    --text-secondary: #6B7FA0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
    }
    header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 20px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  }
  h1 {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  }
  h1 span { color: var(--gold); }
  .header-tag {
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.2em;
  margin-bottom: 6px;
  }
  .header-date {
  font-size: 11px;
  color: var(--text-secondary);
  text-align: right;
  line-height: 1.8;
  }
  .header-date strong {
  color: var(--text-primary);
  }
  .section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.carte {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
}
  .grille-news {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.actu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
}
.actu-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;

}

  color: var(--gold);

  border: 1px solid rgba(212,168,67,0.3);
  padding: 2px 8px;
  border-radius: 4px;
}
.actu-item a {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  text-decoration: none;
  padding: 8px 0;
  line-height: 1.5;
  border-bottom: 1px solid var(--border);
}
.actu-item a:hover { color: var(--text-primary); }

  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  }
  #etf-hero .carte-etf {
  padding: 28px 36px;

  font-size: 52px;

  font-size: 16px;

    color: var(--gold);

  }
  .carte-nom {

  margin-bottom: 4px;

  .badge {

  border: 1px solid rgba(224, 82, 82, 0.4);

  gap: 8px;

  padding-top: 10px;
  border-top: 1px solid var(--border);
  }
  .corr-label {
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--text-muted, #3A4A66);
  min-width: 55px;
  }
  .corr-val {
  font-size: 10px;
  color: var(--text-secondary);
  min-width: 28px;
  text-align: right;
  }
  .corr-bar-bg {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  }
  .corr-bar-fill { height: 100%; border-radius: 2px; }

  .corr-bar-fill.badge-moyen { background: var(--gold); }
  .corr-bar-fill.badge-faible { background: var(--red); }

  border-color: var(--gold);
  margin-bottom: 20px;
  }
  .carte-etf .carte-prix {
  font-size: 32px;
  }
  .carte-etf .carte-nom {
  font-size: 15px;
  }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .etf-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.etf-stats {
  display: flex;
  gap: 28px;
}
.etf-stat {
  text-align: center;
}
.etf-stat-label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-muted, #3A4A66);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.etf-stat-value {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}

  footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-secondary);
}
footer strong { color: var(--gold); font-weight: 400; }
.footer-dot { color: var(--teal); }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.3;
  pointer-events: none;
  z-index: -1;
}

<div class="section-header" style="margin-bottom: 16px;">

<div id="actualites" class="grille-news"></div>
  <script>
    const container = document.getElementById("contenu");

    function corrInfo(c) {
  if (c >= 0.75) return { label: "Strong", classe: "badge-strong" };
  if (c >= 0.55) return { label: "Moderate", classe: "badge-moderate" };
  return { label: "Weak", classe: "badge-weak" };
}

const titreActu = document.createElement("div");
  
DATA.forEach(t => {
  const carte = document.createElement("div");
  const couleur = t.variation >= 0 ? "pos" : "neg";
  const signe = t.variation >= 0 ? "+" : "";

  if (t.ticker === "2646.T") {
    carte.className = "carte carte-etf";
    carte.innerHTML = `
  <div class="carte-top" style="justify-content: space-between; align-items: flex-start;">
  <div>
    <div class="carte-ticker">${t.ticker}</div>
    <div class="carte-nom">${t.nom}</div>
  </div>
  <svg width="96" height="64" viewBox="0 0 96 64" style="opacity:0.9;">
    <rect width="96" height="64" rx="4" fill="#FFFFFF"/>
    <circle cx="48" cy="32" r="18" fill="#D4143A"/>
  </svg>
  </div>
  <div class="etf-bottom">
    <div class="carte-prix">¥${t.prix} <span class="variation-badge ${couleur}">${signe}${t.variation}%</span></div>
    <div class="etf-stats">
      <div class="etf-stat">
        <span class="etf-stat-label">Market</span>
        <span class="etf-stat-value">TSE</span>
      </div>
      <div class="etf-stat">
        <span class="etf-stat-label">Currency</span>
        <span class="etf-stat-value">JPY</span>
      </div>
      <div class="etf-stat">
        <span class="etf-stat-label">Holdings</span>
        <span class="etf-stat-value">30</span>
      </div>
    </div>

  </div>
`;
document.getElementById("etf-hero").appendChild(carte);
} else {
    const corr = corrInfo(t.correlation);
    carte.className = "carte";
    carte.innerHTML = `
      <div class="carte-top">
        <div>
          <div class="carte-ticker">${t.ticker}</div>
          <div class="carte-nom">${t.nom}</div>
        </div>
        <span class="badge ${corr.classe}">${corr.label}</span>
      </div>
      <div class="carte-prix">¥${t.prix} <span class="variation-badge ${couleur}">${signe}${t.variation}%</span></div>
      <div class="carte-corr-row">
        <span class="corr-label">90D CORR</span>
        <div class="corr-bar-bg">
          <div class="corr-bar-fill ${corr.classe}" style="width: ${Math.round(t.correlation * 100)}%"></div>
        </div>
        <span class="corr-val">${t.correlation}</span>
      </div>
    `;
    container.appendChild(carte);
}
});

const actuContainer = document.getElementById("actualites");
DATA.forEach(t => {
  if (t.news && t.news.length > 0) {
    const card = document.createElement("div");
    card.className = "actu-card";
    const items = t.news.map(n => `
      <div class="actu-item">
        <a href="${n.lien}" target="_blank">${n.titre}</a>
      </div>
    `).join("");
    card.innerHTML = `
      <div class="actu-card-header">
        <span class="actu-ticker-pill">${t.ticker}</span>
        <span style="font-size:12px; color: var(--text-secondary);">${t.nom}</span>
      </div>
      ${items}
    `;
    actuContainer.appendChild(card);
  }
});
